<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <title>Birthdays</title>
    </head>
    <body>
        <div class="header">
            <h1>Birthdays</h1>
        </div>
        <div class="container">
            <div class="section">

                <h2>Add a Birthday</h2>
                <!-- TODO: Create a form for users to submit a name, a month, and a day -->
                 <form action="/" method="post">
                    <input name="name" type="text" placeholder="Name" autocomplete="off">
                    <input name="month" type="number" placeholder="Month" autocomplete="off" min="1" max="12">
                    <input name="day" type="number" placeholder="Day" autocomplete="off" min="1" max="31">
                    <button type="submit" style="padding:5px; margin:7px;">Add Birthday</button>
                 </form>
            </div>

            <div class="section">

                <h2>All Birthdays</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- TODO: Loop through the database entries to display them in this table -->
                         {% for bday in birthdays %}
                         <tr>
                            <td>{{bday["name"]}}</td>
                            <td>{{bday["month"]}}/{{bday["day"]}}</td>
                            <td>
                                <form action="/delete" method="post">
                                    <input type="hidden" name="id" value='{{bday["id"]}}'>
                                    <button type="submit" style="background-color:pink; text-decoration:underline;">delete</button>
                                </form>
                            </td>
                         </tr>
                         {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
