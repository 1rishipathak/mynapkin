{% extends "layout.html" %}

{% block main %}
    <form action="/buy" method="post">
        Stock: <input name="symbol" type="text" autofocus autocomplete="off" placeholder="Stock Symbol">
        <p></p>
        Quantity of shares: <input name="shares" type="number" autocomplete="off" placeholder="Number of shares">
        <p></p>
        <button type="submit" style="background-color: green; font-size: xx-large">Buy</button>
    </form>

{% endblock %}
