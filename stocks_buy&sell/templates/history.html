{% extends "layout.html" %}

{% block main %}
    <h1> TRANSACTION HISTORY </h1>
    <table>
        <thead>
            <th style="border:2px solid black; font-size: xx-large;">Stock</th>
            <th style="border:2px solid black; font-size: xx-large;">Quantity</th>
            <th style="border:2px solid black; font-size: xx-large;">Price</th>
            <th style="border:2px solid black; font-size: xx-large;">B/S</th>
            <th style="border:2px solid black; font-size: xx-large;">Date & Time</th>
        </thead>
        <tbody>
            {% for row in rows %}
                <tr>
                    <td style="border: 3px solid black; padding:auto; margin:auto; font-size: x-large;">{{row["stock"]}}</td>
                    <td style="border: 3px solid black; padding:auto; margin:auto; font-size: x-large;">{{row["qty"]}}</td>
                    <td style="border: 3px solid black; padding:auto; margin:auto; font-size: x-large;">{{price}}</td>
                    <td style="border: 3px solid black; padding:auto; margin:auto; font-size: x-large;">{{row["type"]}}</td>
                    <td style="border: 3px solid black; padding:auto; margin:auto; font-size: x-large;">{{row["datetime"]}}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock %}
