{% extends "layout.html" %}

{% block main %}
    <h1> PORTFOLIO </h1>
    <table>
        <thead>
            <th style="border:2px solid black;">Stock</th>
            <th style="border:2px solid black;">Quantity</th>
            <th style="border:2px solid black;">Live Price</th>
            <th style="border:2px solid black;">Value</th>
        </thead>
        <tbody>
            {% for holding in holdings %}
                <tr>
                    <td style="border: 3px solid black; padding:auto; margin:auto;">{{holding["stock"]}}</td>
                    <td style="border: 3px solid black; padding:auto; margin:auto;">{{holding["qty"]}}</td>
                    <td style="border: 3px solid black; padding:auto; margin:auto;">{{holding["price"]}}</td>
                    <td style="border: 3px solid black; padding:auto; margin:auto;">{{holding["value"]}}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <p></p> <p></p> <p></p> <p></p> <p></p>
    <h4>Cash Balance: {{cash}}</h4>
    <h3>Total Value: {{placeholder}} </h3>




{% endblock %}
