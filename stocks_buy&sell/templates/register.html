{% extends "layout.html" %}

{% block main %}
    <form action="/register" method="post" style="font-size: x-large; font-weight: 500;">
        Username:   <input name="username" type="text"  autocomplete="off" autofocus placeholder="Please enter Username">
        <p></p>
        Password:   <input name="password" type="text" autocomplete="off" placeholder="Please enter password">
        <p></p>
        Re-enter Password:<input name="confirmation" type="text" autocomplete="off" placeholder="Please confirm password">
        <p></p>
        <button type="submit" style="background-color: lightgreen; margin:auto;">Register</button>
    </form>

{% endblock %}
